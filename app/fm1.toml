# Polly's build settings (fm1-base's tools/build.py: ./build.sh)
name = "Polly"                 # the build's files: polly.fwsc, polly-X.Y.fwsc
id_prefix = "FM-1_3"           # package identity: dev FM-1_300, releases FM-1_3XXYYZZ (as Polly 0.4)
usb_manufacturer = "Polly"
usb_product = "Polly FM-1"
# Bluetooth on fm1-base's own stack (Optimist's, bt/: nothing of JieLi's linked): Bluetooth MIDI in from a computer or a
# phone (on by default, as the stock firmware and LOOM-8; Setup's BT MIDI), and audio out to headphones and speakers
# (A2DP; Setup's BT AUDIO, AUDIO DEVICE). The radio starts at power-on unless both are off (app.h APP_BLE_AT_BOOT)
ble = true
ble_stack = "own"
bt_audio = true
usb_audio_in = true            # the music recordable over USB (Setup's USB AUDIO: follows the knob, or full)
usb_audio_out = true           # the computer plays through the FM-1 (Setup's COMPUTER AUDIO: off by default, or on)
mirror = true                  # the screen and panel in a browser (web/mirror), the panel played from it (tools/polly_remote.py)
backup = true                  # the songs backed up and restored over USB (tools/fm1_backup.py, web/backup)
# the resource region (tools/gen_res.py: the factory styles' patterns and notes, 43 KB), written by the installer after
# an update into the sectors the store's pool freed (app.h APP_RES_BASE; fm1-base device/res.c)
gen = ["../tools/gen_res.py {gen}/res.bin"]
# (dsp/arr.c: the styles' tables read from the region, not compiled in; Sonivox's pool: it takes 22 KB at start on the
# host, all of it then and no more, never on the way; 32 KB, not 96: the pool's 64 KB for Bluetooth. Status shows it)
o2_cflags = ["-DSTY_IN_RES=1", "-DEAS_POOL_BYTES=32768"]
resources = "{gen}/res.bin"
resources_what = "the factory styles"   # (the installer's words: "Writing the factory styles")
resources_what_ja = "内蔵スタイル"
words = "words.tsv"
font_full = ["L"]              # chord names and page names in the big face, lower case too
include = ["dsp", "dsp/eas"]
device_include = ["dsp/eas/fm1inc"]   # the C library headers EAS wants, for the firmware (the host has its own)
vendored = ["dsp/eas/"]        # Sonivox EAS (Apache-2.0): the register check skips it
# room in the image: .ram_text and .data LZMA-packed, unpacked at boot (Melodee's: ~2 KB); the UI and the platform at
# -Oz (16.5 KB); the main-loop o2 units and the sequencer for size (tools/size_units.py: ~13 KB). EAS stays -O2
boot_pack = true
unity_opt = "z"
ir_pass = "../tools/size_units.py"
# the instrument and the arranger, at -O2
o2 = ["dsp/gm.c", "dsp/chords.c", "dsp/xpose.c", "dsp/arr.c", "dsp/loops.c", "dsp/leads.c", "dsp/notes.c",
      "dsp/templates.c", "dsp/qydec.c", "dsp/qybank.c",
      "dsp/eas/eas_chorus.c", "dsp/eas/eas_chorusdata.c", "dsp/eas/eas_config.c", "dsp/eas/eas_data.c",
      "dsp/eas/eas_filter.c", "dsp/eas/eas_host_fm1.c", "dsp/eas/eas_math.c", "dsp/eas/eas_midi.c",
      "dsp/eas/eas_mididata.c", "dsp/eas/eas_mixbuf.c", "dsp/eas/eas_mixer.c", "dsp/eas/eas_pan.c", "dsp/eas/eas_pcm.c",
      "dsp/eas/eas_pcmdata.c", "dsp/eas/eas_public.c", "dsp/eas/eas_reverb.c", "dsp/eas/eas_reverbdata.c",
      "dsp/eas/eas_smf.c", "dsp/eas/eas_smfdata.c", "dsp/eas/eas_sndlibmgt.c", "dsp/eas/eas_voicemgt.c",
      "dsp/eas/eas_wtengine.c", "dsp/eas/eas_wtsynth.c", "dsp/eas/wt_200k_G.c"]
# the site
tagline = "A pocket arranger for the FM-1"
repo = "https://github.com/charlesvestal/fm1-polly"
licence = "GPL-3.0-only"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments). GM sounds: Sonivox EAS (Apache-2.0). Drums: the Groove MIDI Dataset (CC BY 4.0)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "Charles Vestal"
description = "Polly is a pocket arranger for the M-VAVE FM-1, inspired by the Yamaha QY70. A style plays a band of eight instruments, and the chords you play steer it. Songs are made of sections, each playing a chord progression, with two melodies running along them. The sounds come from the General MIDI set of Sonivox EAS, and MIDI in plays them too, so Polly also works as a General MIDI sound module."
tags = ["arranger", "chords", "sequencer", "general-midi", "midi"]
install = "https://charlesvestal.github.io/fm1-polly/install/"
site = "https://charlesvestal.github.io/fm1-polly/"
screenshot = "docs/img/manual/home.png"
